name: YouTube Multi-Cut (Safe H264)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL YouTube"
        required: true
      segments:
        description: "Segmen waktu (contoh: 01:14:00-01:14:23 02:00:00-02:00:25)"
        required: true
      resolution:
        description: "Resolusi maksimal"
        required: true
        type: choice
        options: [ "720", "1080", "1440", "2160" ]
        default: "1080"
      fps:
        description: "FPS target"
        required: true
        type: choice
        options: [ "original", "24", "30", "60", "120" ]
        default: "original"
      bitrate:
        description: "Bitrate video"
        required: true
        type: choice
        options: [ "auto", "5M", "10M", "20M" ]
        default: "auto"

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y ffmpeg jq
          pip install yt-dlp

      - name: Buat cookies dari Secret
        run: echo "${{ secrets.YT_COOKIES }}" > cookies.txt

      - name: Ambil direct stream URL
        run: |
          yt-dlp --cookies cookies.txt -g \
            -f "bv*[vcodec^=avc1][height<=${{ github.event.inputs.resolution }}]+ba/b[height<=${{ github.event.inputs.resolution }}]" \
            "${{ github.event.inputs.url }}" > urls.txt

          echo "VIDEO_URL=$(head -n1 urls.txt)" >> $GITHUB_ENV
          echo "AUDIO_URL=$(tail -n1 urls.txt)" >> $GITHUB_ENV

      - name: Potong segmen dengan ffmpeg
        run: |
          FPS="${{ github.event.inputs.fps }}"
          BITRATE="${{ github.event.inputs.bitrate }}"

          EXTRA_ARGS=""
          if [ "$FPS" != "original" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -r $FPS"
          fi
          if [ "$BITRATE" != "auto" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -b:v $BITRATE"
          fi

          i=1
          for SEG in ${{ github.event.inputs.segments }}; do
            echo "🎬 Potong segmen $SEG ..."
            START=$(echo $SEG | cut -d- -f1)
            END=$(echo $SEG | cut -d- -f2)

            ffmpeg -ss $START -to $END -i "$VIDEO_URL" -i "$AUDIO_URL" \
              -c:v libx264 -preset fast -crf 23 -c:a aac $EXTRA_ARGS -shortest "clip${i}.mp4"

            i=$((i+1))
          done

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: youtube-multi-cut
          path: "*.mp4"

      - name: Bersihkan file lama
        run: rm -f urls.txt
