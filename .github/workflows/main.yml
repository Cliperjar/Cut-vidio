name: YouTube Single-Cut (Safe H264 + Fallback)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL YouTube"
        required: true
      segment:
        description: "Segmen waktu (contoh: 00:06:16-00:06:45)"
        required: true
      resolution:
        description: "Resolusi maksimal"
        required: true
        type: choice
        options: [ "720", "1080", "1440", "2160" ]
        default: "1080"
      fps:
        description: "FPS target"
        required: true
        type: choice
        options: [ "original", "24", "30", "60", "120" ]
        default: "original"
      bitrate:
        description: "Bitrate video"
        required: true
        type: choice
        options: [ "auto", "5M", "10M", "20M" ]
        default: "auto"

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y ffmpeg jq
          pip install yt-dlp

      - name: Buat cookies dari Secret
        run: echo "${{ secrets.YT_COOKIES }}" > cookies.txt

      - name: Potong video dengan fallback
        run: |
          # Normalisasi input (hapus spasi, ganti en-dash jadi minus)
          SEG_RAW="${{ github.event.inputs.segment }}"
          SEG=$(echo "$SEG_RAW" | sed 's/–/-/g' | sed 's/ //g')
          START=$(echo $SEG | cut -d'-' -f1)
          END=$(echo $SEG | cut -d'-' -f2)

          echo "🎬 Coba ambil langsung segmen: $SEG"

          yt-dlp --cookies cookies.txt \
            -f "bv*[vcodec^=avc1][height<=${{ github.event.inputs.resolution }}]+ba/b[height<=${{ github.event.inputs.resolution }}]" \
            --download-sections "*$SEG" \
            --merge-output-format mp4 \
            -o "clip.mp4" \
            "${{ github.event.inputs.url }}" || true

          # fallback kalau gagal
          if [ ! -s "clip.mp4" ]; then
            echo "⚠️ Gagal ambil langsung. Download full video..."
            yt-dlp --cookies cookies.txt \
              -f "bv*[vcodec^=avc1][height<=${{ github.event.inputs.resolution }}]+ba/b[height<=${{ github.event.inputs.resolution }}]" \
              -o "full.%(ext)s" \
              "${{ github.event.inputs.url }}"

            echo "✂️ Potong dengan ffmpeg..."
            ffmpeg -i full.mp4 -ss $START -to $END -c:v libx264 -preset fast -crf 23 -c:a aac clip.mp4
            rm -f full.*
          fi

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: youtube-single-cut
          path: clip.mp4

      - name: Bersihkan file lama
        run: rm -f source.* clip*.webm
